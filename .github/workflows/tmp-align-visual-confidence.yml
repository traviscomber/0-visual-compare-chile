name: One-shot visual confidence fixture alignment

on:
  push:
    paths:
      - ".github/workflows/tmp-align-visual-confidence.yml"

permissions:
  contents: write

jobs:
  align-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align visual-only denomination confidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/cloud-browser.spec.mjs")
          text = path.read_text(encoding="utf-8")
          old = "denomination_confidence: 0.18,"
          new = "denomination_confidence: null,"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale visual-only confidence fixture, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("aligned one visual-only denomination confidence fixture")
          PY

      - name: Commit fixture alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/cloud-browser.spec.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "test(e2e): align visual-only confidence fixture"
          git push origin HEAD:main
