name: Cloud Browser E2E

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Run one real public investigation against OpenAI/INAPI"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "e2e/**"
      - ".github/workflows/e2e-cloud-browser.yml"

permissions:
  contents: read

concurrency:
  group: videntia-cloud-browser-e2e
  cancel-in-progress: true

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      E2E_BASE_URL: "https://videntia.app"
      E2E_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify public indexing contract
        run: node e2e/check-public-indexing.mjs

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated Playwright test runtime
        run: pnpm add --save-dev --ignore-workspace-root-check --lockfile=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2

      - name: Install Chromium Firefox and WebKit
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run production cross-browser journey
        run: pnpm exec playwright test --config=e2e/playwright.config.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videntia-cloud-browser-cross-browser-evidence
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14
