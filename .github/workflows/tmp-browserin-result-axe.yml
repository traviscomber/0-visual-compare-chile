name: One-shot Browserin result-state Axe gate

on:
  push:
    paths:
      - ".github/workflows/tmp-browserin-result-axe.yml"

permissions:
  contents: write

jobs:
  patch-result-axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extend Axe to mocked result states
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/cloud-browser.spec.mjs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              text = text.replace(old, new, 1)
              print(f"{label}: patched")

          replace_once(
              'import { expect, test } from "@playwright/test"\nimport pngjs from "pngjs"',
              'import { expect, test } from "@playwright/test"\nimport AxeBuilder from "@axe-core/playwright"\nimport pngjs from "pngjs"',
              "Axe import",
          )

          replace_once(
              'const RUN_LIVE_INVESTIGATION = process.env.E2E_LIVE === "1"',
              'const RUN_LIVE_INVESTIGATION = process.env.E2E_LIVE === "1"\nconst AXE_TAGS = ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]\nconst BLOCKING_A11Y_IMPACTS = new Set(["serious", "critical"])',
              "Axe constants",
          )

          replace_once(
              'denomination_source: "not-detected",\n    denomination_confidence: 0.18,',
              'denomination_source: "not-detected",\n    denomination_confidence: null,',
              "visual-only confidence fixture",
          )

          anchor = '''async function installMockPreviewApi(page, responseBody) {
  await page.route("**/api/v1/public/trademark-preview", async (route) => {
    expect(route.request().method()).toBe("POST")
    await route.fulfill({
      status: 200,
      contentType: "application/json",
      body: JSON.stringify(responseBody),
    })
  })
}
'''
          helper = anchor + '''
async function expectNoBlockingAccessibilityViolations(page, testInfo, label) {
  const result = await new AxeBuilder({ page })
    .withTags(AXE_TAGS)
    .analyze()

  const blocking = result.violations.filter((violation) => BLOCKING_A11Y_IMPACTS.has(violation.impact))

  await testInfo.attach(`axe-${label}.json`, {
    body: Buffer.from(JSON.stringify({
      url: page.url(),
      label,
      violations: result.violations,
      passes: result.passes.length,
      incomplete: result.incomplete,
    }, null, 2)),
    contentType: "application/json",
  })

  const summary = blocking.map((violation) => ({
    id: violation.id,
    impact: violation.impact,
    help: violation.help,
    targets: violation.nodes.flatMap((node) => node.target).slice(0, 5),
  }))

  expect(summary, `${label} has serious or critical Axe findings`).toEqual([])
}
'''
          replace_once(anchor, helper, "Axe result-state helper")

          trademark_anchor = '''    await expectNoNestedInteractiveControls(page)
    await expectNoHorizontalOverflow(page)

    const continueLink = page.getByRole("link", { name: /Continuar investigación/i })
'''
          trademark_new = '''    await expectNoNestedInteractiveControls(page)
    await expectNoHorizontalOverflow(page)
    if (browserName === "chromium") await expectNoBlockingAccessibilityViolations(page, testInfo, "mock-trademark-result")

    const continueLink = page.getByRole("link", { name: /Continuar investigación/i })
'''
          replace_once(trademark_anchor, trademark_new, "trademark result Axe gate")

          visual_anchor = '''    await expect(page.getByRole("link", { name: /Continuar investigación/i })).toHaveCount(0)
    await expectNoNestedInteractiveControls(page)
    await expectNoHorizontalOverflow(page)

    await page.setViewportSize({ width: 390, height: 844 })
'''
          visual_new = '''    await expect(page.getByRole("link", { name: /Continuar investigación/i })).toHaveCount(0)
    await expectNoNestedInteractiveControls(page)
    await expectNoHorizontalOverflow(page)
    if (browserName === "chromium") await expectNoBlockingAccessibilityViolations(page, testInfo, "mock-visual-only-result")

    await page.setViewportSize({ width: 390, height: 844 })
'''
          replace_once(visual_anchor, visual_new, "visual-only result Axe gate")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit result-state accessibility gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/cloud-browser.spec.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "test(e2e): gate mocked result accessibility"
          git push origin HEAD:main
