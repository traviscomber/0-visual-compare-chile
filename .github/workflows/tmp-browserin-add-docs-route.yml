name: One-shot Browserin docs route patch

on:
  push:
    paths:
      - ".github/workflows/tmp-browserin-add-docs-route.yml"

permissions:
  contents: write

jobs:
  patch-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add docs to public route audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/cloud-browser.spec.mjs")
          text = path.read_text(encoding="utf-8")
          old = 'const publicRoutes = ["/", "/demo", "/contacto", "/privacidad", "/terminos"]'
          new = 'const publicRoutes = ["/", "/demo", "/contacto", "/docs", "/privacidad", "/terminos"]'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one publicRoutes definition, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit Browserin route coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/cloud-browser.spec.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "test(e2e): include docs in public route audit"
          git push origin HEAD:main
