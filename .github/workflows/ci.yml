name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Niza regression
        run: pnpm test:niza

      - name: Analytics privacy regression
        run: pnpm test:analytics

      - name: API key listing regression
        run: pnpm test:api-key-listing

      - name: Phase1 window regression
        run: pnpm test:phase1-window

      - name: Case role regression
        run: pnpm test:case-roles

      - name: Case collaboration security regression
        run: node scripts/case-collaboration-security-regression.mts

      - name: Case brief evidence regression
        run: node scripts/case-brief-evidence-regression.mts

      - name: Company direction regression
        run: node scripts/company-direction-regression.mts

      - name: Company identity quality benchmark
        run: node scripts/company-identity-quality-benchmark.mts

      - name: Grade A block 1-3 regression
        run: node scripts/grade-a-block-1-3-regression.mts

      - name: Grade A block 4-6 regression
        run: node scripts/grade-a-block-4-6-regression.mts

      - name: Positioning regression
        run: node scripts/positioning-regression.mts

      - name: Technology evidence relevance regression
        run: node scripts/technology-evidence-relevance-regression.mts

      - name: Technology corroboration regression
        run: node scripts/technology-corroboration-regression.mts

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Next.js production build
        run: pnpm build:raw