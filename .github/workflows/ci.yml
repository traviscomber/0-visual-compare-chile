name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Niza regression
        run: pnpm test:niza

      - name: Analytics privacy regression
        run: pnpm test:analytics

      - name: API key listing regression
        run: pnpm test:api-key-listing

      - name: Phase1 window regression
        run: pnpm test:phase1-window

      - name: Case role regression
        run: pnpm test:case-roles

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Next.js production build
        run: pnpm build:raw
