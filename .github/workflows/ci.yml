name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Niza regression
        run: pnpm test:niza
      - name: Analytics privacy regression
        run: pnpm test:analytics
      - name: API key listing regression
        run: pnpm test:api-key-listing
      - name: Phase1 window regression
        run: pnpm test:phase1-window
      - name: Case role regression
        run: pnpm test:case-roles
      - name: Case collaboration security regression
        run: node scripts/case-collaboration-security-regression.mts
      - name: Case brief evidence regression
        run: node scripts/case-brief-evidence-regression.mts
      - name: Company direction regression
        run: node scripts/company-direction-regression.mts
      - name: Company identity quality benchmark
        run: node scripts/company-identity-quality-benchmark.mts
      - name: Company watch canonical identity regression
        run: node scripts/company-watch-canonical-identity-regression.mts
      - name: Grade A block 1-3 regression
        run: node scripts/grade-a-block-1-3-regression.mts
      - name: Grade A block 4-6 regression
        run: node scripts/grade-a-block-4-6-regression.mts
      - name: Action layer regression
        run: node scripts/action-layer-regression.mts
      - name: Action lifecycle regression
        run: node scripts/action-lifecycle-regression.mts
      - name: Action SLA inbox regression
        run: node scripts/action-sla-regression.mts
      - name: Action due automation regression
        run: node scripts/action-due-automation-regression.mts
      - name: Recommendation lifecycle regression
        run: node scripts/recommendation-lifecycle-regression.mts
      - name: Opportunities workspace regression
        run: node scripts/opportunities-workspace-regression.mts
      - name: Opportunity Engine regression
        run: node scripts/opportunity-engine-regression.mts
      - name: Opportunity thesis persistence regression
        run: node scripts/opportunity-thesis-persistence-regression.mts
      - name: Opportunity conviction regression
        run: node scripts/opportunity-conviction-regression.mts
      - name: Opportunity conviction cron regression
        run: node scripts/opportunity-conviction-cron-regression.mts
      - name: Opportunity human decision regression
        run: node scripts/opportunity-human-decision-regression.mts
      - name: Opportunity executive attention regression
        run: node scripts/opportunity-executive-attention-regression.mts
      - name: Opportunity conviction notification regression
        run: node scripts/opportunity-conviction-notification-regression.mts
      - name: Opportunity prototype execution regression
        run: node scripts/opportunity-prototype-execution-regression.mts
      - name: Dashboard opportunities regression
        run: node scripts/dashboard-opportunities-regression.mts
      - name: Executive flow gates regression
        run: node scripts/executive-flow-gates-regression.mts
      - name: Executive attention queue regression
        run: node scripts/executive-attention-queue-regression.mts
      - name: Executive attention actions regression
        run: node scripts/executive-attention-actions-regression.mts
      - name: Executive unassigned action regression
        run: node scripts/executive-action-unassigned-regression.mts
      - name: Executive critical escalation regression
        run: node scripts/executive-critical-escalation-regression.mts
      - name: Executive escalation visibility regression
        run: node scripts/executive-attention-escalation-visibility-regression.mts
      - name: Executive attention ownership regression
        run: node scripts/executive-attention-ownership-regression.mts
      - name: Executive accountability ranking regression
        run: node scripts/executive-accountability-ranking-regression.mts
      - name: Public product architecture regression
        run: node scripts/public-product-architecture-regression.mts
      - name: Portal and common watches regression
        run: node scripts/portal-common-watches-regression.mts
      - name: Patent prior-art regression
        run: node scripts/patent-prior-art-regression.mts
      - name: WIPO patent watch regression
        run: node scripts/wipo-patent-watch-regression.mts
      - name: Common intelligence reports regression
        run: node scripts/common-reports-regression.mts
      - name: Positioning regression
        run: node scripts/positioning-regression.mts
      - name: Technology evidence relevance regression
        run: node scripts/technology-evidence-relevance-regression.mts
      - name: Technology corroboration regression
        run: node scripts/technology-corroboration-regression.mts
      - name: Technology strategy regression
        run: node scripts/technology-strategy-regression.mts
      - name: Search intent regression
        run: node scripts/search-intent-regression.mts
      - name: GDELT raw canonical regression
        run: node scripts/gdelt-raw-canonical-regression.mts
      - name: GDELT context fusion regression
        run: node scripts/gdelt-context-fusion-regression.mts
      - name: SNIFA environmental risk regression
        run: node scripts/snifa-risk-regression.mts
      - name: SNIFA canonical company regression
        run: node scripts/snifa-canonical-company-regression.mts
      - name: SNIFA regulatory timeline regression
        run: node scripts/snifa-regulatory-timeline-regression.mts
      - name: SNIFA regulatory timeline UI regression
        run: node scripts/snifa-regulatory-timeline-ui-regression.mts
      - name: Strategic onboarding regression
        run: node scripts/strategic-onboarding-regression.mts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Next.js production build
        run: pnpm build:raw
