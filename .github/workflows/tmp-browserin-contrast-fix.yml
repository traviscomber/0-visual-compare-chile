name: One-shot Browserin contrast fix

on:
  push:
    paths:
      - ".github/workflows/tmp-browserin-contrast-fix.yml"

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix light CTA contrast specificity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/home-premium.css")
          text = path.read_text(encoding="utf-8")
          old = ".px-btn-light{background:#edf1ef;color:#07100f}"
          new = ".px-home .px-btn-light{background:#edf1ef;color:#07100f}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one light CTA rule, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit contrast fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/home-premium.css
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(home): restore accessible light CTA contrast"
          git push origin HEAD:main
