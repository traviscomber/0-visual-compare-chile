name: One-shot Browserin auth prefetch fix

on:
  push:
    paths:
      - ".github/workflows/tmp-browserin-auth-prefetch-fix.yml"

permissions:
  contents: write

jobs:
  patch-auth-prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable speculative auth prefetch on public pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path("app/page.tsx")
          home_text = home.read_text(encoding="utf-8")
          old_home = '<Link href="/auth/login" className="px-btn px-btn-ghost">Iniciar sesión</Link>'
          new_home = '<Link href="/auth/login" prefetch={false} className="px-btn px-btn-ghost">Iniciar sesión</Link>'
          home_count = home_text.count(old_home)
          if home_count != 2:
              raise SystemExit(f"home auth links: expected 2 occurrences, found {home_count}")
          home.write_text(home_text.replace(old_home, new_home), encoding="utf-8")

          demo = Path("app/demo/page.tsx")
          demo_text = demo.read_text(encoding="utf-8")
          old_demo = '<Link href="/auth/login">Iniciar sesión</Link>'
          new_demo = '<Link href="/auth/login" prefetch={false}>Iniciar sesión</Link>'
          demo_count = demo_text.count(old_demo)
          if demo_count != 1:
              raise SystemExit(f"demo auth link: expected 1 occurrence, found {demo_count}")
          demo.write_text(demo_text.replace(old_demo, new_demo), encoding="utf-8")

          print("Browserin auth prefetch patch ready: 2 home links + 1 demo link")
          PY

      - name: Commit auth prefetch fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/demo/page.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(public): disable auth prefetch from public pages"
          git push origin HEAD:main
