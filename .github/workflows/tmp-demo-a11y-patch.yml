name: One-shot demo accessibility patch

on:
  push:
    paths:
      - ".github/workflows/tmp-demo-a11y-patch.yml"

permissions:
  contents: write

jobs:
  patch-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace nested interactive controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/demo/page.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '<Link href="/auth/login"><Button variant="ghost" className="hidden rounded-lg text-[#A8B0BA] hover:bg-white/[0.06] hover:text-white sm:inline-flex">Iniciar sesión</Button></Link>',
                  '<Button asChild variant="ghost" className="hidden rounded-lg text-[#A8B0BA] hover:bg-white/[0.06] hover:text-white sm:inline-flex"><Link href="/auth/login">Iniciar sesión</Link></Button>',
              ),
              (
                  '<Link href="/contacto"><Button className="rounded-lg bg-white text-[#0A0E13] shadow-none hover:bg-[#E7ECEA]">Solicitar acceso</Button></Link>',
                  '<Button asChild className="rounded-lg bg-white text-[#0A0E13] shadow-none hover:bg-[#E7ECEA]"><Link href="/contacto">Solicitar acceso</Link></Button>',
              ),
              (
                  '<Link href={contactHref}><Button className="shrink-0 gap-2 rounded-lg bg-white text-[#111827] hover:bg-[#E7ECEA]">Continuar investigación <ArrowRight className="h-4 w-4" /></Button></Link>',
                  '<Button asChild className="shrink-0 gap-2 rounded-lg bg-white text-[#111827] hover:bg-[#E7ECEA]"><Link href={contactHref}>Continuar investigación <ArrowRight className="h-4 w-4" /></Link></Button>',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/demo/page.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(demo): remove nested interactive controls"
          git push origin HEAD:main
