name: One-shot Browserin public accessibility fix

on:
  push:
    paths:
      - ".github/workflows/tmp-browserin-public-a11y-fix.yml"

permissions:
  contents: write

jobs:
  patch-public-a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch public accessibility findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_all(path_s, old, new, label):
              path = Path(path_s)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"{label}: expected at least one occurrence of {old!r}")
              text = text.replace(old, new)
              if old in text:
                  raise SystemExit(f"{label}: replacement incomplete for {old!r}")
              path.write_text(text, encoding="utf-8")
              print(f"{label}: replaced {count} occurrence(s)")

          def replace_once(path_s, old, new, label):
              path = Path(path_s)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"{label}: patched")

          replace_all("app/demo/page.tsx", "text-[#66727F]", "text-[#8994A1]", "demo muted text")
          replace_all("app/demo/page.tsx", "text-[#6F7A87]", "text-[#8994A1]", "demo secondary muted text")
          replace_all("app/contacto/page.tsx", "text-[#66727F]", "text-[#8994A1]", "contact muted text")
          replace_all("app/privacidad/page.tsx", "text-[#66727F]", "text-[#8994A1]", "privacy brand microcopy")
          replace_all("app/terminos/page.tsx", "text-[#66727F]", "text-[#8994A1]", "terms brand microcopy")
          replace_all("components/public-legal-footer.tsx", "text-[#6F7A87]", "text-[#8994A1]", "public footer muted text")
          replace_all("app/docs/page.tsx", "text-[#64748B]", "text-[#475569]", "docs brand microcopy")

          old_pre = '<pre className="overflow-x-auto rounded-xl border border-black/10 bg-[#EEF1EE] p-4 text-xs leading-6 text-[#344054]">'
          new_pre = '<pre tabIndex={0} className="overflow-x-auto rounded-xl border border-black/10 bg-[#EEF1EE] p-4 text-xs leading-6 text-[#344054]">'
          replace_once("app/docs/page.tsx", old_pre, new_pre, "docs keyboard-scrollable code blocks")
          PY

      - name: Commit accessibility fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/demo/page.tsx app/contacto/page.tsx app/docs/page.tsx app/privacidad/page.tsx app/terminos/page.tsx components/public-legal-footer.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(public): resolve Browserin accessibility findings"
          git push origin HEAD:main
