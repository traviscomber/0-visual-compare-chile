<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1742 903" role="img" aria-label="VIDENTIA geometric intelligence artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#06101a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1320" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#9b958a" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="#e6d9be" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#efe0c2"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14202a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#03070d" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f817b"/>
      <stop offset="1" stop-color="#356b67"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174a43"/>
      <stop offset="1" stop-color="#0d3733"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c615d"/>
      <stop offset="1" stop-color="#24544f"/>
    </linearGradient>
    <radialGradient id="orb" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#17322f"/>
      <stop offset="1" stop-color="#071311"/>
    </radialGradient>
  </defs>

  <rect width="1742" height="903" fill="url(#bg)"/>

  <!-- long shadow cast by the orb -->
  <path d="M1388 575 L1115 790 L742 903 L1240 621 Z" fill="url(#shadow)" opacity="0.95"/>

  <!-- illuminated road / data beam -->
  <path d="M704 903 C950 772 1137 661 1358 547 L1517 445 L1517 507 L1384 601 C1169 714 958 819 790 903 Z" fill="url(#beam)"/>

  <!-- cube -->
  <polygon points="1376,229 1515,145 1662,231 1519,314" fill="url(#cubeTop)"/>
  <polygon points="1376,229 1519,314 1519,487 1376,403" fill="url(#cubeLeft)"/>
  <polygon points="1519,314 1662,231 1662,403 1519,487" fill="url(#cubeRight)"/>

  <!-- cream seam entering cube -->
  <path d="M1519 314 L1662 231 L1554 331 L1554 507 L1519 487 Z" fill="#eadcc1"/>

  <!-- orb -->
  <circle cx="1383" cy="570" r="26" fill="url(#orb)"/>
</svg>
